name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ORT_VERSION: 1.25.1

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # ONNX Runtime is a C library the bindings link against. The engine tests
      # run against a small synthetic model with the same I/O signature as the
      # real checkpoint, so CI never downloads 670 MB of weights.
      - name: Install ONNX Runtime
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          sudo tar -xzf /tmp/ort.tgz -C /opt
          sudo mv "/opt/onnxruntime-linux-x64-${ORT_VERSION}" /opt/onnxruntime
          echo "/opt/onnxruntime/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig

      - name: Generate the synthetic test model
        run: |
          pip install --quiet onnx numpy
          python3 scripts/gen_testmodel.py testdata/synthetic-model

      - name: Format
        run: |
          if [ -n "$(gofmt -l $(git ls-files '*.go'))" ]; then
            echo "these files are not formatted:"
            gofmt -l $(git ls-files '*.go')
            exit 1
          fi

      - name: Vet
        run: go vet -tags sqlite_fts5 ./...
        env:
          CGO_CFLAGS: -I/opt/onnxruntime/include
          CGO_LDFLAGS: -L/opt/onnxruntime/lib

      - name: Test
        run: go test -tags sqlite_fts5 -race -count=1 ./...
        env:
          CGO_CFLAGS: -I/opt/onnxruntime/include
          CGO_LDFLAGS: -L/opt/onnxruntime/lib
          ONNXRUNTIME_LIB: /opt/onnxruntime/lib/libonnxruntime.so

      - name: Build
        run: make build
        env:
          ORT: /opt/onnxruntime

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true   # advisory until a fix exists upstream

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install ONNX Runtime
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          sudo tar -xzf /tmp/ort.tgz -C /opt
          sudo mv "/opt/onnxruntime-linux-x64-${ORT_VERSION}" /opt/onnxruntime
          echo "/opt/onnxruntime/lib" | sudo tee /etc/ld.so.conf.d/onnxruntime.conf
          sudo ldconfig

      # The synthetic model has the real checkpoint's exact I/O signature and a
      # deterministic decoder, so the whole stack runs without downloading
      # 670 MB of weights. These tests exercise the approval gate and the
      # sandbox, neither of which cares what the recogniser returns.
      - name: Generate the synthetic model
        run: |
          pip install --quiet onnx numpy
          python3 scripts/gen_testmodel.py testdata/synthetic-model
          cp testdata/synthetic-model/silero_vad.onnx testdata/synthetic-model/ 2>/dev/null || true

      - name: Build the server
        run: make build
        env:
          ORT: /opt/onnxruntime

      - name: Build the interface
        working-directory: web
        run: |
          npm ci
          npm run build
          rm -rf .next/standalone/.next/static
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || true

      - name: Start the stack
        run: |
          mkdir -p /tmp/e2e-workspace /tmp/e2e-data
          git -C /tmp/e2e-workspace init -q
          echo hello > /tmp/e2e-workspace/README.md

          # A fixed key, because the tests need it and this server exists for
          # ninety seconds inside a throwaway runner.
          KEY="nk_ci00000000000000_$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=')"
          echo "NEELKIT_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "NEELKIT_WORKSPACE_ROOT=/tmp/e2e-workspace" >> "$GITHUB_ENV"

          NEELKIT_API_KEY="$KEY" ./bin/neelkitd \
            -models testdata/synthetic-model \
            -data /tmp/e2e-data \
            -workspace /tmp/e2e-workspace \
            -addr 127.0.0.1:8420 \
            -llm none -log-format text > /tmp/neelkitd.log 2>&1 &

          (cd web && PORT=3000 HOSTNAME=127.0.0.1 \
            NEXT_PUBLIC_API_URL=http://127.0.0.1:8420 \
            node .next/standalone/server.js > /tmp/web.log 2>&1 &)

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8420/healthz >/dev/null && \
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8420/healthz || { cat /tmp/neelkitd.log; exit 1; }
        env:
          LD_LIBRARY_PATH: /opt/onnxruntime/lib

      - name: Run Playwright
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Server logs on failure
        if: failure()
        run: tail -100 /tmp/neelkitd.log /tmp/web.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
